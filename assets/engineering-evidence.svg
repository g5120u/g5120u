<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
<defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#111827}.muted{fill:#6b7280}.title{font-size:24px;font-weight:850}.head{font-size:16px;font-weight:850}.cell{font-size:13px;font-weight:650}.box{fill:#ffffff;stroke:#d1d5db;stroke-width:2}.safe{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.private{fill:#fef2f2;stroke:#ef4444;stroke-width:2}</style>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="480" y="42" text-anchor="middle" class="title">Engineering Evidence Without Core Exposure | 不暴露核心的工程證據</text>
<text x="480" y="70" text-anchor="middle" class="muted">Code matters, but proof can be layered: public signals first, controlled review only when appropriate.</text>
<rect x="54" y="104" width="190" height="46" class="box"/>
<rect x="244" y="104" width="370" height="46" class="safe"/>
<rect x="614" y="104" width="290" height="46" class="private"/>
<text x="72" y="134" class="head">Layer</text>
<text x="262" y="134" class="head">Visible proof</text>
<text x="632" y="134" class="head">Protected boundary</text>
<rect x="54" y="150" width="190" height="62" class="box"/>
<rect x="244" y="150" width="370" height="62" class="box"/>
<rect x="614" y="150" width="290" height="62" class="box"/>
<text x="72" y="187" class="head">Public profile</text>
<text x="262" y="187" class="cell">engineering trace, tech scope, public repo activity</text>
<text x="632" y="187" class="cell">no source code or product rules</text>
<rect x="54" y="212" width="190" height="62" class="box"/>
<rect x="244" y="212" width="370" height="62" class="box"/>
<rect x="614" y="212" width="290" height="62" class="box"/>
<text x="72" y="249" class="head">Safe evidence</text>
<text x="262" y="249" class="cell">redacted screenshots, QA notes, issue-style summaries</text>
<text x="632" y="249" class="cell">no real data, secrets, or full flows</text>
<rect x="54" y="274" width="190" height="62" class="box"/>
<rect x="244" y="274" width="370" height="62" class="box"/>
<rect x="614" y="274" width="290" height="62" class="box"/>
<text x="72" y="311" class="head">Controlled demo</text>
<text x="262" y="311" class="cell">phone demo, selected behavior walkthrough</text>
<text x="632" y="311" class="cell">no open download link or public credentials</text>
<rect x="54" y="336" width="190" height="62" class="box"/>
<rect x="244" y="336" width="370" height="62" class="box"/>
<rect x="614" y="336" width="290" height="62" class="box"/>
<text x="72" y="373" class="head">Technical review</text>
<text x="262" y="373" class="cell">limited diff reading, call-path explanation, test result discussion</text>
<text x="632" y="373" class="cell">no full repo handoff</text>
<text x="480" y="394" text-anchor="middle" class="muted">The goal is credibility, not full disclosure: show reasoning, verification, and ownership without handing over the blueprint.</text>
</svg>
