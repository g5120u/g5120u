<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
<defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#111827}.muted{fill:#6b7280}.title{font-size:24px;font-weight:850}.layer{font-size:16px;font-weight:850}.tool{font-size:13px;font-weight:750;fill:#2563eb}.body{font-size:12px;font-weight:650;fill:#4b5563}.box{fill:#ffffff;stroke:#d1d5db;stroke-width:2}.shield{fill:#fff7ed;stroke:#f97316;stroke-width:2}.line{stroke:#9ca3af;stroke-width:3;stroke-linecap:round}</style>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="480" y="42" text-anchor="middle" class="title">Sanitized Case Study | 去敏案例研究</text>
<text x="480" y="70" text-anchor="middle" class="muted">Local service workflow system, shown as capability layers instead of source code or business rules.</text>
<rect x="50" y="112" width="270" height="76" rx="12" class="box"/>
<text x="68" y="140" class="layer">Mobile</text>
<text x="68" y="160" class="tool">Flutter / Android</text>
<text x="68" y="178" class="body">app flow, permissions, device QA</text>
<rect x="345" y="112" width="270" height="76" rx="12" class="box"/>
<text x="363" y="140" class="layer">Backend</text>
<text x="363" y="160" class="tool">Node.js / Express</text>
<text x="363" y="178" class="body">services, APIs, diagnostics</text>
<rect x="640" y="112" width="270" height="76" rx="12" class="box"/>
<text x="658" y="140" class="layer">Realtime</text>
<text x="658" y="160" class="tool">WebSocket / FCM</text>
<text x="658" y="178" class="body">events, notifications, sync</text>
<rect x="50" y="214" width="270" height="76" rx="12" class="box"/>
<text x="68" y="242" class="layer">Map</text>
<text x="68" y="262" class="tool">Location APIs</text>
<text x="68" y="280" class="body">location and map integration</text>
<rect x="345" y="214" width="270" height="76" rx="12" class="box"/>
<text x="363" y="242" class="layer">Data</text>
<text x="363" y="262" class="tool">Relational DB</text>
<text x="363" y="280" class="body">state, audit, migrations</text>
<rect x="640" y="214" width="270" height="76" rx="12" class="box"/>
<text x="658" y="242" class="layer">QA</text>
<text x="658" y="262" class="tool">Playwright / ADB</text>
<text x="658" y="280" class="body">screenshots, logs, regression checks</text>
<line x1="120" y1="304" x2="840" y2="304" class="line"/>
<rect x="240" y="328" width="480" height="54" rx="14" class="shield"/>
<text x="480" y="352" text-anchor="middle" class="layer">Protected</text>
<text x="480" y="372" text-anchor="middle" class="body">source code, data design, settlement, operations rules, credentials, real users</text>
</svg>
