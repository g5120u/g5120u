<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
<defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#111827}.muted{fill:#6b7280}.panel{fill:#ffffff;stroke:#d1d5db;stroke-width:2}.public{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.private{fill:#fff7ed;stroke:#f97316;stroke-width:2}.title{font-size:24px;font-weight:800}.heading{font-size:20px;font-weight:800}.item{font-size:15px;font-weight:650}.caption{font-size:14px;font-weight:650}</style>
</defs>
<rect width="100%" height="100%" fill="#f9fafb"/>
<text x="480" y="44" text-anchor="middle" class="title">Public / Private Boundary | 公開與私有邊界</text>
<text x="480" y="72" text-anchor="middle" class="muted caption">Show delivery capability without exposing the system blueprint.</text>
<rect x="60" y="105" width="390" height="270" rx="14" class="public"/>
<rect x="510" y="105" width="390" height="270" rx="14" class="private"/>
<text x="90" y="150" class="heading">Public Signals</text>
<text x="540" y="150" class="heading">Kept Private</text>
<text x="90" y="196" class="item">- Google Play availability signal</text>
<text x="90" y="230" class="item">- Live mobile demonstration</text>
<text x="90" y="264" class="item">- Public samples with mock data</text>
<text x="90" y="298" class="item">- GitHub activity and learning labs</text>
<text x="540" y="196" class="item">- Source code</text>
<text x="540" y="230" class="item">- Settlement flow</text>
<text x="540" y="264" class="item">- Operations details</text>
<text x="540" y="298" class="item">- Data design and business logic</text>
<line x1="480" y1="118" x2="480" y2="362" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 8"/>
<text x="480" y="405" text-anchor="middle" class="muted caption">The public profile is a controlled portfolio surface, not a full product handoff.</text>
</svg>
